<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão Agrícola - Jovem Ciência</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #2e7d32; font-size: 24px; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-top: 0; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="range"] { width: 100%; accent-color: #2e7d32; }
        .val { float: right; color: #2e7d32; font-weight: bold; }
        
        /* BOTÃO VERDE ORIGINAL PEDIDO */
        .btn-verde { background-color: #2e7d32; color: white; border: none; padding: 15px; width: 100%; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; display: block; margin-top: 10px; }
        .btn-verde:hover { background-color: #1b5e20; }
        
        #painel-resposta { display: none; margin-top: 25px; text-align: left; }
        #caixa-status { padding: 15px; border-radius: 6px; font-weight: bold; margin-bottom: 10px; font-size: 15px; text-align: center; }
        #caixa-dica { background-color: #f9f9f9; padding: 15px; border-left: 4px solid #2e7d32; border-radius: 4px; font-size: 13px; line-height: 1.5; color: #444; margin-bottom: 10px; }
        #caixa-eco { background-color: #e8f5e9; border: 1px dashed #2e7d32; padding: 12px; border-radius: 6px; font-size: 13px; color: #1b5e20; margin-bottom: 10px; font-weight: bold; }
        #caixa-certeza { font-size: 11px; color: #777; text-align: right; font-style: italic; }
        
        .cor-alto { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .cor-medio { background-color: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
        .cor-seca { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .cor-charco { background-color: #e1f5fe; color: #0277bd; border: 1px solid #81d4fa; }

        .historico-box { margin-top: 35px; text-align: left; }
        .historico-box h3 { color: #2e7d32; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 10px; }
        .table-wrap { max-height: 150px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
        th, td { padding: 8px; border-bottom: 1px solid #eee; }
        th { background-color: #f7f9f8; font-weight: bold; color: #555; position: sticky; top: 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 Previsão Agrícola Sustentável com IA</h1>
    <p>Projeto de Mostra Científica - Jovem Ciência</p>
    <hr>

    <div class="input-group">
        <label>Umidade do Solo: <span id="txt-umidade" class="val">50%</span></label>
        <input type="range" id="slide-umidade" min="0" max="100" value="50" oninput="mudarValores()">
    </div>

    <div class="input-group">
        <label>Temperatura Média: <span id="txt-temp" class="val">25°C</span></label>
        <input type="range" id="slide-temp" min="10" max="50" value="25" oninput="mudarValores()">
    </div>

    <div class="input-group">
        <label>Dias Sem Chuva: <span id="txt-chuva" class="val">3 dias</span></label>
        <input type="range" id="slide-chuva" min="0" max="30" value="3" oninput="mudarValores()">
    </div>

    <button type="button" class="btn-verde" onclick="calcularPrevisaoIA()">📊 Rodar Algoritmo de Previsão</button>

    <div id="painel-resposta">
        <div id="caixa-status"></div>
        <div id="caixa-dica"></div>
        <div id="caixa-eco"></div>
        <div id="caixa-certeza"></div>
    </div>

    <div class="historico-box">
        <h3>📋 Registro de Monitoramento</h3>
        <div class="table-wrap">
            <table id="tabela-dados">
                <thead>
                    <tr>
                        <th>Solo</th>
                        <th>Temp.</th>
                        <th>Estiagem</th>
                        <th>Veredicto IA</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Pesos neurais da IA baseados na planilha de dados
    const pesosModelo = {
        alto:  { u: 2.5,  t: -1.2, c: -2.0, b: -0.5 },
        seca:  { u: -3.0, t: 2.5,  c: 3.0,  b: -1.0 },
        agua:  { u: 4.0,  t: -2.0, c: -4.0, b: -2.0 },
        medio: { u: 0.5,  t: 0.5,  c: 0.2,  b: 0.0  }
    };

    const textosDicas = {
        alto:  "<strong>Orientação:</strong> Solo e clima perfeitos. Mantenha as regas atuais e faça vistorias semanais.",
        seca:  "<strong>Alerta:</strong> Risco alto de seca! Inicie a irrigação de emergência e cubra a terra com folhas secas.",
        agua:  "<strong>Alerta:</strong> Solo encharcado! Desligue os irrigadores e abra valas para escoar o excesso de água.",
        medio: "<strong>Orientação:</strong> Clima instável. Monitore o campo de perto e faça uma rega leve se o calor aumentar."
    };

    function mudarValores() {
        document.getElementById('txt-umidade').innerText = document.getElementById('slide-umidade').value + '%';
        document.getElementById('txt-temp').innerText = document.getElementById('slide-temp').value + '°C';
        document.getElementById('txt-chuva').innerText = document.getElementById('slide-chuva').value + ' dias';
    }

    function calcularPrevisaoIA() {
        let valU = parseInt(document.getElementById('slide-umidade').value);
        let valT = parseInt(document.getElementById('slide-temp').value);
        let valC = parseInt(document.getElementById('slide-chuva').value);

        // Entrada normalizada (matemática da IA de 0 a 1)
        let nU = valU / 100;
        let nT = (valT - 10) / 40;
        let nC = valC / 30;

        let ativacoes = {};
        let somaTotal = 0;

        // Executa a equação do neurônio artificial
        for (let chave in pesosModelo) {
            let p = pesosModelo[chave];
            let calculo = (nU * p.u) + (nT * p.t) + (nC * p.c) + p.b;
            ativacoes[chave] = Math.max(0.01, calculo + 5);
            somaTotal += ativacoes[chave];
        }

        // Escolhe o resultado vencedor de maior valor
        let maiorValor = -Infinity;
        let veredicto = "";
        for (let chave in ativacoes) {
            if (ativacoes[chave] > maiorValor) {
                maiorValor = ativacoes[chave];
                veredicto = chave;
            }
        }

        let certeza = Math.round((ativacoes[veredicto] / somaTotal) * 100);
        
        let painel = document.getElementById('painel-resposta');
        let cStatus = document.getElementById('caixa-status');
        let cDica = document.getElementById('caixa-dica');
        let cEco = document.getElementById('caixa-eco');
        let cCerteza = document.getElementById('caixa-certeza');

        painel.style.display = "block";
        cStatus.className = "";

        let nomePrint = "";
        let aguaPoupada = 0;

        if (veredicto === "alto") {
            cStatus.innerHTML = "✅ Sucesso Alto";
            cStatus.classList.add("cor-alto");
            nomePrint = "Sucesso Alto";
            aguaPoupada = 250;
        } else if (veredicto === "seca") {
            cStatus.innerHTML = "🚨 Risco de Seca";
            cStatus.classList.add("cor-seca");
            nomePrint = "Risco Seca";
            aguaPoupada = 100;
        } else if (veredicto === "agua") {
            cStatus.innerHTML = "🌊 Solo Encharcado";
            cStatus.classList.add("cor-charco");
            nomePrint = "Encharcado";
            aguaPoupada = 800;
        } else {
            cStatus.innerHTML = "⚠️ Sucesso Médio";
            cStatus.classList.add("cor-medio");
            nomePrint = "Sucesso Médio";
            aguaPoupada = 150;
        }

        cDica.innerHTML = textosDicas[veredicto];
        cEco.innerHTML = `🌳 Sustentabilidade: Evita o desperdício de ${aguaPoupada} litros de água por dia neste setor.`;
        cCerteza.innerText = `Certeza matemática da Rede Neural: ${certeza}%`;

        // Alimenta a tabela abaixo
        let tabela = document.getElementById("tabela-dados").getElementsByTagName('tbody');
        let linha = tabela.insertRow(0);
        linha.insertCell(0).innerText = valU + "%";
        linha.insertCell(1).innerText = valT + "°C";
        linha.insertCell(2).innerText = valC + "d";
        linha.insertCell(3).innerText = nomePrint;
    }
</script>
</body>
</html>
