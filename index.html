<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA de Manutenção de Tratores</title>
    
    <!-- Importando o PyScript para rodar Python no HTML -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; }
        h1, h2 { color: #333; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #2b7a78; color: white; border: none; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #3aafa9; }
        .resultado { margin-top: 25px; padding: 15px; background: #eef2f3; border-radius: 6px; }
        .peca-status { margin-bottom: 15px; padding: 10px; border-left: 5px solid #ccc; background: white; }
        .urgente { border-left-color: #d9534f; color: #d9534f; }
        .atencao { border-left-color: #f0ad4e; color: #f0ad4e; }
        .bom { border-left-color: #5cb85c; color: #5cb85c; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚜 IA Preditiva de Tratores</h1>
    <p style="text-align: center; color: #666;">Calcule o desgaste real das peças por inteligência matemática</p>

    <!-- Formulário de Entrada -->
    <label for="horas_uso">Horas atuais do Horímetro:</label>
    <input type="number" id="horas_uso" value="300" min="0">

    <label for="severidade">Severidade do Trabalho (Ambiente):</label>
    <select id="severidade">
        <option value="1.0">Leve (Transporte plano / Pouco pó)</option>
        <option value="1.2">Moderado (Preparo de solo padrão)</option>
        <option value="1.5">Pesado (Solo compactado / Muita poeira / Extremo)</option>
    </select>

    <label for="idade_maquina">Estado Geral / Idade do Trator:</label>
    <select id="idade_maquina">
        <option value="1.0">Novo (Até 2.000 horas)</option>
        <option value="1.1">Intermediário (2.000 a 5.000 horas)</option>
        <option value="1.25">Antigo (Mais de 5.000 horas)</option>
    </select>

    <button py-click="calcular_manutencao">Calcular Desgaste de Peças</button>

    <!-- Painel de Resultados -->
    <div class="resultado">
        <h2>Relatório de Troca Recomendada</h2>
        <div id="painel_resultados">Clique no botão acima para processar os dados em Python.</div>
    </div>
</div>

<!-- CÓDIGO PYTHON DA SUA IA -->
<script type="py">
from pyscript import document

def calcular_manutencao(event):
    # 1. Captura os dados digitados na tela usando Python
    horas_atuais = float(document.querySelector("#horas_uso").value)
    fator_s = float(document.querySelector("#severidade").value)
    fator_a = float(document.querySelector("#idade_maquina").value)
    
    # 2. Base de dados técnica das peças (Tempo de fábrica padrão)
    pecas = {
        "Filtros (Ar, Óleo e Combustível)": {"limite": 400, "tipo": "filtro"},
        "Correias": {"limite": 1200, "tipo": "correia"},
        "Fluidos e Lubrificantes": {"limite": 250, "tipo": "fluido"},
        "Bicos e Elementos de Injeção": {"limite": 3500, "tipo": "padrao"},
        "Mangueiras e Vedações": {"limite": 2000, "tipo": "padrao"},
        "Discos de Freio e Embreagem": {"limite": 5000, "tipo": "atrito"}
    }
    
    html_gerado = ""
    
    # 3. Execução do Modelo Matemático Preditivo para cada peça
    for nome_peca, dados in pecas.items():
        limite_fabrica = dados["limite"]
        
        # Aplicação das fórmulas específicas discutidas no modelo
        if dados["tipo"] == "filtro":
            horas_limite_real = limite_fabrica / fator_s
        elif dados["tipo"] == "correia":
            horas_limite_real = limite_fabrica / fator_a
        elif dados["tipo"] == "atrito":
            horas_limite_real = limite_fabrica * (2.0 - fator_s)
        else:
            horas_limite_real = limite_fabrica / (fator_s * (fator_a * 0.8))

        # Calcula a vida útil restante em porcentagem
        vida_restante = max(0, int(((horas_limite_real - (horas_atuais % horas_limite_real)) / horas_limite_real) * 100))
        
        # Determina a classe de urgência visual baseada no resultado numérico
        if vida_restante <= 15:
            classe_css = "peca-status urgente"
            status_texto = "⚠️ TROCA IMEDIATA RECOMENDADA"
        elif vida_restante <= 50:
            classe_css = "peca-status atencao"
            status_texto = "⚡ Planejar troca em breve"
        else:
            classe_css = "peca-status bom"
            status_texto = "✅ Funcionamento Seguro"
            
        # Monta o bloco de resposta
        html_gerado += f"""
        <div class='{classe_css}'>
            <strong>{nome_peca}</strong><br>
            Vida Útil Restante: {vida_restante}%<br>
            <small>Status: {status_texto} (Limite calculado: {int(horas_limite_real)}h)</small>
        </div>
        """
        
    # 4. Devolve o resultado processado pelo Python direto para a tela
    document.querySelector("#painel_resultados").innerHTML = html_gerado
</script>

</body>
</html>
